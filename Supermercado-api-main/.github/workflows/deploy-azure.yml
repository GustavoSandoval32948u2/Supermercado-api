name: Deploy Supermercado API a Azure

# Se ejecuta cuando se hace push a main
on:
  push:
    branches:
      - main
  workflow_dispatch:  # también permite ejecutarlo manualmente desde GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Iniciar sesión en Azure Container Registry
      - name: Login a Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: supermercadoacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Construir y publicar la imagen Docker
      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./SuperMercado
          file: ./configs/docker/Dockerfile
          push: true
          tags: |
            supermercadoacr.azurecr.io/supermercado-api:latest
            supermercadoacr.azurecr.io/supermercado-api:${{ github.sha }}

      # 4. Iniciar sesión en Azure
      - name: Login a Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 5. Desplegar en Azure App Service
      - name: Deploy a Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: supermercado-api-app
          images: supermercadoacr.azurecr.io/supermercado-api:${{ github.sha }}

      # 6. Verificar que la API responde
      - name: Health check post-deploy
        run: |
          sleep 30
          curl --fail https://supermercado-api-app.azurewebsites.net/health \
            || echo "Health check falló, revisar logs en Azure Portal"

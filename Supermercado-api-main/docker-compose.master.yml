# Microservicios:
#   CONTAINERIZATION.md
#   TESTING_GUIDE.md > Test 2
#   ARCHITECTURE.md > Opción 2

# Kubernetes:
#   CONTAINERIZATION.md > Kubernetes
#   TESTING_GUIDE.md > Test 3
#   kubernetes-deployment.yml
#   ARCHITECTURE.md > Opción 3

# Producción:

version: '3.8'

# 🎯 DOCKER COMPOSE MAESTRO - SELECTOR DE VERSIONES
# Este archivo integra todas las versiones en un solo lugar
# Elige la configuración que necesites descomentando

# █████████████████████████████████████████████████████████████
# 1️⃣ DESARROLLO SIMPLE (1 API + DB + Load Balancer)
# █████████████████████████████████████████████████████████████

# DESCOMENTA ESTA SECCIÓN PARA DESARROLLO
# docker-compose -f docker-compose.yml up -d

# █████████████████████████████████████████████████████████████
# 2️⃣ MICROSERVICIOS (2+ APIs + Load Balancer)
# █████████████████████████████████████████████████████████████

# DESCOMENTA ESTA SECCIÓN PARA MICROSERVICIOS
# docker-compose -f docker-compose.microservices.yml up -d

# █████████████████████████████████████████████████████████████
# 3️⃣ PRODUCCIÓN (Docker Compose)
# █████████████████████████████████████████████████████████████

# DESCOMENTA ESTA SECCIÓN PARA PRODUCCIÓN
# docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d

# █████████████████████████████████████████████████████████████
# 4️⃣ KUBERNETES (Auto-scaling, Orquestación)
# █████████████████████████████████████████████████████████████

# DESCOMENTA ESTA SECCIÓN PARA KUBERNETES
# kubectl apply -f kubernetes-sqlserver.yml
# kubectl apply -f kubernetes-deployment.yml

# █████████████████████████████████████████████████████████████
# 🎯 USA EL CLI MAESTRO PARA FACILITAR (RECOMENDADO)
# █████████████████████████████████████████████████████████████

# Linux/Mac:
#   ./supermarket-cli.sh help
#   ./supermarket-cli.sh up 1        (Desarrollo)
#   ./supermarket-cli.sh up 2        (Microservicios)
#   ./supermarket-cli.sh up 3        (Kubernetes)
#   ./supermarket-cli.sh up 4        (Producción)

# Windows PowerShell:
#   .\supermarket-cli.ps1 help
#   .\supermarket-cli.ps1 up 1
#   .\supermarket-cli.ps1 up 2
#   .\supermarket-cli.ps1 up 3
#   .\supermarket-cli.ps1 up 4

